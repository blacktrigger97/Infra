[databases]
# Format: local_db_name = host=postgres_container_name port=5432 dbname=actual_db_name
airflow = host=postgresql.bdc.home port=5432 dbname=bdc
hue = host=postgresql.bdc.home port=5432 dbname=bdc
polaris = host=postgresql.bdc.home port=5432 dbname=bdc
cfgloghndlr = host=postgresql.bdc.home port=5432 dbname=bdc
root = host=postgresql.bdc.home port=5432 dbname=bdc

[pgbouncer]
# Network settings
listen_addr = pgbouncer.bdc.home
listen_port = 6432

# Authentication settings
auth_type = plaintext
auth_file = /etc/pgbouncer/userlist.txt

# Pool configuration
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

# Logging and management
admin_users = root
stats_users = root
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

# Connection sanitation
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
